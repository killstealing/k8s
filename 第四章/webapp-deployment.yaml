apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kubeguide/tomcat-app:v1
        ports:
        - containerPort: 8080