apiVersion: v1
kind: Pod
metadata:
  name: volume-test-two-secret
spec:
  containers:
  - name: container-test
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:latest
    command: ["sh","-c","sleep 1h"]
    volumeMounts:
    - name: all-in-one
      mountPath: "projected-volume"
      readOnly: true
  volumes:
  - name: all-in-one
    projected:
      sources:
      - secret:
          name: mysecret
          items:
          - key: username
            path: my-group/my-username
      - secret:
          name: mysecret
          items:
          - key: password
            path: my-group/my-password
            mode: 511