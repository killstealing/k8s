apiVersion: v1
kind: ReplicationController
metadata:
  name: redis-master
  labels:
    name: redis-master
spec:
  replicas: 1
  selector:
    name: redis-master
  template:
    metadata:
      labels:
        name: redis-master
    spec:
      containers:
      - name: master
        image: swr-gallery.swr-pro.myhuaweicloud.com/library/redis:7
        ports:
        - containerPort: 6379
      nodeSelector:
        zone: north