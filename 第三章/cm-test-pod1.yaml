apiVersion: v1
kind: Pod
metadata:
  name: cm-test-pod1
spec:
  containers:
  - name: cm-test
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:latest
    command: ["/bin/sh","-c","env"]
    envFrom:
    - configMapRef:
        name: cm-appvars        #根据cm-appvars中的key=value 自动生成环境变量
  restartPolicy: Never