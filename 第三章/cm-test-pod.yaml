apiVersion: v1
kind: Pod
metadata:
  name: cm-test-pod
spec:
  containers:
  - name: cm-test
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:latest
    command: ["/bin/sh","-c","env | grep APP"]
    env:
    - name: APPLOGLEVEL               #定义环境变量的名称
      valueFrom:                      #key "apploglevel" 对应的值
        configMapKeyRef:
          name: cm-appvars            # 环境变量的值取自cm-appvars:
          key: apploglevel            # key为apploglevel
    - name: APPDATADIR
      valueFrom:
        configMapKeyRef:
          name: cm-appvars            # 环境变量的值取自cm-appvars
          key: appdatadir             # key 为appdatadir
  restartPolicy: Never