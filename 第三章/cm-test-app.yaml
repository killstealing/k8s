apiVersion: v1
kind: Pod
metadata:
  name: cm-test-app
spec:
  containers:
  - name: cm-test-app
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kubeguide/tomcat-app:v1
    ports: 
    - containerPort: 8080
    volumeMounts:
    - name: serverxml               #引用volume的名称
      mountPath: /configfiles       #挂载到容器内的目录
  volumes:
  - name: serverxml                 #定义volume的名称
    configMap:
      name: cm-appconfigfiles       #使用ConfigMap "cm-appconfigfiles"
      items:
      - key: key-serverxml          #key=key-serverxml
        path: server.xml            #value将server.xml文件名进行挂载
      - key: key-loggingproperties  #key=key-loggingproperties
        path: logging.properties    #value 将logging.properties文件名进行挂载