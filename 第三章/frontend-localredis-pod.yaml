apiVersion: v1
kind: Pod
metadata:
  name: redis-php
  labels:
    name: redis-php
spec:
  containers:
  - name: frontend
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kubeguide/guestbook-php-frontend
    ports:
    - conntainerPort: 80
  - name: redis
    image: kubeguide/redis-master
    ports:
    - containerPort: 6379